# Pushing a version tag (e.g. v0.5.0) makes a GitHub release, with that version's
# section of setup/CHANGELOG.md as the notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v v="$version" '/^## /{show = ($2 == v); next} show' setup/CHANGELOG.md > notes.md
          gh release create "$TAG" --title "LoNSeMonSy $version" --notes-file notes.md
