# Runs lint/lint.sh (ShellCheck, yamllint, JSON) on each push and pull request.
# Results: the Actions tab on GitHub, and the Lint badge in the README.
name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck and yamllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck yamllint
      - name: Run lint/lint.sh
        run: ./lint/lint.sh
