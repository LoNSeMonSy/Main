# Where alert email goes.
#
# Grafana reaches Gmail directly (EHLO + STARTTLS + AUTH) using the GF_SMTP_*
# values from .env. Wazuh's own wazuh-maild cannot do this -- it is HELO-only
# plain SMTP with no AUTH -- which is why notification lives here and not in
# ossec.conf.
#
# The address comes from ALERT_EMAIL_TO in .env.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: lonsemonsy-email
    receivers:
      - uid: lonsemonsy-email-primary
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          # One email per alert group rather than one per series, so a burst of
          # scan hits arrives as a single readable message.
          singleEmail: true
          subject: '{{ template "lonsemonsy.subject" . }}'
        disableResolveMessage: true

  # The same, plus an email when it's resolved: for things that get fixed (disk, backups).
  - orgId: 1
    name: lonsemonsy-email-resolved
    receivers:
      - uid: lonsemonsy-email-resolved
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true
          subject: '{{ template "lonsemonsy.subject" . }}'
        disableResolveMessage: false

  # High and Critical alarms: the email starts with what happened and what to do.
  - orgId: 1
    name: lonsemonsy-email-urgent
    receivers:
      - uid: lonsemonsy-email-urgent
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true
          subject: '{{ template "lonsemonsy.subject" . }}'
          message: '{{ template "lonsemonsy.urgent" . }}'
        disableResolveMessage: true

  # The AI explainer (n8n). Only used when AI explanations are on (setup/ai.sh).
  - orgId: 1
    name: lonsemonsy-ai-explainer
    receivers:
      - uid: lonsemonsy-ai-webhook
        type: webhook
        settings:
          url: http://n8n:5678/webhook/lonsemonsy-alert
          httpMethod: POST
        disableResolveMessage: true
