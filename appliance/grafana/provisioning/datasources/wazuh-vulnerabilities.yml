apiVersion: 1

# Wazuh's list of known security issues per device, for the Vulnerabilities page.
datasources:
  - name: Wazuh vulnerabilities
    uid: lons-wazuh-vulns
    type: grafana-opensearch-datasource
    access: proxy
    url: https://172.20.0.1:9200
    basicAuth: true
    basicAuthUser: $__env{WAZUH_INDEXER_USER}
    jsonData:
      tlsSkipVerify: true
      flavor: opensearch
      version: 2.19.5
      database: "wazuh-states-vulnerabilities-*"
      timeField: "vulnerability.detected_at"
    secureJsonData:
      basicAuthPassword: $__env{WAZUH_INDEXER_PASSWORD}
    editable: false
