apiVersion: 1

# Reads the NetAlertX device database (SQLite) read-only, so the network device
# inventory and new-device counts appear in Grafana — the one customer-facing pane.
datasources:
  - name: NetAlertX
    type: frser-sqlite-datasource
    access: proxy
    jsonData:
      path: /var/lib/netalertx/db/app.db
    editable: false
