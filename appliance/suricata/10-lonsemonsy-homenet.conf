# LoNSeMonSy: derive HOME_NET at every start instead of hardcoding a site range
# into suricata.yaml. Keeps the stock vendor config untouched and survives a
# DHCP change or a deploy at a customer on a completely different subnet.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/bin/suricata -D --af-packet -c /etc/suricata/suricata.yaml --pidfile /run/suricata.pid --set vars.address-groups.HOME_NET="[$(/usr/local/sbin/lonsemonsy-homenet)]"'
