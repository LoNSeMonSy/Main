name: lonsemonsy

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    # Only reachable from the appliance itself. Grafana and the other containers
    # use the Docker network (http://influxdb:8086), so nothing on the LAN needs it.
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards that ship with the repo. Previously this directory existed but
      # was never mounted and had no provider, so a fresh install had no
      # dashboards at all until someone imported them by hand.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Read-only view of the NetAlertX device DB so Grafana can show the device
      # inventory in the same pane (SQLite datasource). RO: Grafana never writes it.
      - netalertx-data:/var/lib/netalertx:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Backups page button: Grafana adds this token and the signed-in user's name.
      - BACKUP_API_TOKEN=${BACKUP_API_TOKEN:-}
      - GF_DATAPROXY_SEND_USER_HEADER=true
      # Button panel (backup trigger) + OpenSearch datasource so Grafana can read
      # the Wazuh indexer. Comma-separated; do not split into two lines.
      - GF_INSTALL_PLUGINS=volkovlabs-form-panel,grafana-opensearch-datasource,frser-sqlite-datasource
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      # Wazuh indexer login used by the provisioned OpenSearch datasource.
      # Use a READ-ONLY indexer user here, never admin (see .env.example).
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-readall}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-}
      # Outbound email for alert notifications. Grafana speaks EHLO+STARTTLS+AUTH
      # so it reaches Gmail directly -- Wazuh's own wazuh-maild cannot (it is
      # HELO-only plain SMTP with no AUTH), which is why alerting lives here.
      # Values come from .env; never hardcode the app password.
      - GF_SMTP_ENABLED=${SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - GF_SMTP_FROM_NAME=${SMTP_FROM_NAME:-LoNSeMonSy}
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # Makes alert emails link back to the dashboard.
      # Blank means Grafana works it out from the address you open it on.
      # 12-hour time everywhere in Grafana.
      - GF_DATE_FORMATS_FULL_DATE=MM/DD/YYYY h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_SECOND=h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=h:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MM/DD h:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MM/DD
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      # Optional sign in with Okta (password + phone code). Turns on when
      # OKTA_GRAFANA_CLIENT_ID is set in .env; the local admin login keeps working.
      # Okta group wazuh-admins or grafana-admins = Grafana Admin, everyone else = Viewer.
      # Uses Okta's default authorization server; groups come from its "groups" claim
      # (that server has no "groups" scope, so don't add it to SCOPES).
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${OKTA_GRAFANA_CLIENT_ID:+true}
      - GF_AUTH_GENERIC_OAUTH_NAME=Okta
      - GF_AUTH_GENERIC_OAUTH_ICON=signin
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${OKTA_GRAFANA_CLIENT_ID:-}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${OKTA_GRAFANA_CLIENT_SECRET:-}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${OKTA_DOMAIN:-}/oauth2/default/v1/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${OKTA_DOMAIN:-}/oauth2/default/v1/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${OKTA_DOMAIN:-}/oauth2/default/v1/userinfo
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'wazuh-admins') && 'Admin' || 'Viewer'"
      # Land on the Active Alarms dashboard instead of Grafana's generic home page.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/lonsemonsy-noc.json
      # Where alert email goes; read by the provisioned contact point. Email is
      # optional, but Grafana won't start with an empty address, so a placeholder is
      # used until ALERT_EMAIL_TO is set (nothing is sent while SMTP is off).
      # Backup buttons call the backup service through Grafana, which adds this token
      # on the server side (provisioning/datasources/backup-service.yml).
      - TRIGGER_TOKEN=${TRIGGER_TOKEN:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-alerts@example.com}
    # Lets the container resolve the host, where the Wazuh indexer runs natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      influxdb:
        condition: service_healthy

  # --- Internal only: our team's Proxmox backups. Customers don't run these. ---
  # Start them with:  docker compose --profile internal up -d
  # Network device discovery + new-device alerts (SRS 3.2 "Scan the Network";
  # roadmap scenario 2). Off-the-shelf: NetAlertX. host networking is REQUIRED for
  # ARP/L2 scanning and only shares the appliance's existing LAN access -- it does
  # NOT touch vmbr0 or change how the GUI is reached. UI 20211, GraphQL 20212.
  netalertx:
    image: ghcr.io/netalertx/netalertx:26.10.24
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - PORT=${NETALERTX_PORT:-20211}
      - GRAPHQL_PORT=${NETALERTX_GRAPHQL_PORT:-20212}
      - TZ=${TZ:-America/New_York}
      # NetAlertX keeps its own time zone setting; use the machine's.
      # Only report brand-new devices (not every connect/disconnect): the real alarms come from Grafana.
      # Login on, with the password setup made (setup also writes it into app.conf).
      - 'APP_CONF_OVERRIDE={"TIMEZONE":"${TZ:-America/New_York}","NTFPRCS_INCLUDED_SECTIONS":"[\"new_devices\"]","NEWDEV_devAlertEvents":"False","SETPWD_enable_password":"True","SETPWD_password":"${NETALERTX_PASSWORD_HASH:-}"}'
      # Which subnet(s) to scan, and on which interface. See .env.example.
      - SCAN_SUBNETS=${SCAN_SUBNETS}
    volumes:
      - netalertx-data:/data
      - /var/log/netalertx:/tmp/log   # its logs, so Wazuh can see wrong passwords

  # Server health numbers (CPU, memory, disk, network) for the System Health page.
  # Host network + the read-only /hostfs mount let it see the real server, not the container.
  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST_MOUNT_PREFIX=/hostfs
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    volumes:
      - /:/hostfs:ro
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy

  # Optional AI alarm explainer (setup question "AI explanations", or: lsmsy ai on).
  # n8n runs the workflow in n8n/alert-explainer.json: Grafana sends it each Medium or
  # worse alarm, it looks up the Wazuh events and asks the model for a short explanation.
  n8n:
    profiles: ["ai"]
    image: n8nio/n8n:2.40.7
    container_name: n8n
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:5678:5678"   # editor only reachable from this server
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/lonsemonsy-n8n:ro
    environment:
      - TZ=${TZ:-UTC}
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - WAZUH_INDEXER_URL=https://172.20.0.1:9200
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-readall}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-}
      - INFLUX_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}

  # The model server, when the AI runs on this same machine (OLLAMA_URL empty).
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.34.4
    container_name: ollama
    restart: unless-stopped
    mem_limit: 5g
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_KEEP_ALIVE=15m
      # Don't keep old prompts in memory: they add up until the model gets killed.
      - LLAMA_ARG_CACHE_RAM=0
      - LLAMA_ARG_CTX_CHECKPOINTS=1

networks:
  # Pinned so the bridge gateway (172.20.0.1) is stable: the Wazuh indexer binds
  # to it, and Grafana reaches the indexer over it. Not routable from the LAN.
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  netalertx-data:
  n8n-data:
  ollama-models:
