# Collects CPU, memory, disk and network numbers from this server every 30 seconds
# and writes them to InfluxDB for the System Health page in Grafana.
[agent]
  interval = "30s"
  flush_interval = "10s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "vfat", "nsfs"]

[[inputs.net]]
  interfaces = ["en*", "eth*"]
  ignore_protocol_stats = true

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
